<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Games</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 1px; background: #1a1a1a; color: white; }
      form { max-width: 400px; margin: 0 auto; }
      label { display: block; margin-bottom: 10px; }
      input { width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
      button { padding: 10px 20px; background: #444; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 10px; }
      button:hover { background: #555; }
    </style>
  </head>
  <body>
    
    <form id="configure-form">
      <label>
        Username:
        <input type="text" id="username">
      </label>
      <label>
        Password:
        <input type="password" id="password">
      </label>
      <button type="submit">Save</button>
    </form>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        window.electronAPI.onConfigureGame((game, index) => {
          document.getElementById('username').value = game.user
          document.getElementById('password').value = game.password
          window.gameIndex = index
          document.title = game.name + ' - Configure'
        })
      })

      document.getElementById('configure-form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const user = document.getElementById('username').value
        const password = document.getElementById('password').value
        await window.electronAPI.saveGameConfig(window.gameIndex, user, password)
        alert('Configuration saved!')
        window.close()
      })
    </script>
  </body>
</html>
