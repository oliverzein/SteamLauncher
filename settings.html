<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
      form { max-width: 400px; margin: 0 auto; }
      label { display: block; margin-bottom: 10px; }
      input { width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
      button { padding: 10px 20px; background: #444; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 10px; }
      button:hover { background: #555; }
      #hidden-games-section { margin-top: 30px; }
      #hidden-games-section h2 { margin-bottom: 10px; }
      .hidden-game-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #2a2a2a; margin-bottom: 5px; border-radius: 4px; }
      .hidden-game-item span { flex: 1; }
      .unhide-btn { background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
      #reload-hidden-btn { margin-bottom: 10px; background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
      #reload-hidden-btn:hover { background: #0056b3; }
    </style>
  </head>
  <body>
    <h1>Settings</h1>
    <form id="settings-form">
      <label>
        Steam Compatdata Paths (comma-separated):
        <textarea id="compatdataPaths" rows="3"></textarea>
      </label>
      <button type="submit">Save</button>
    </form>

    <div id="hidden-games-section">
      <h2>Hidden Games</h2>
      <button id="reload-hidden-btn">Reload Hidden Games</button>
      <div id="hidden-games-list"></div>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', async () => {
        const config = await window.electronAPI.getConfig()
        document.getElementById('compatdataPaths').value = config.compatdataPaths.join(', ')

        // Load and display hidden games
        await loadHiddenGames()

        // Add reload button listener
        document.getElementById('reload-hidden-btn').addEventListener('click', loadHiddenGames)

        // Listen for config updates
        window.electronAPI.onConfigUpdated(() => {
          loadHiddenGames()
        })

        async function loadHiddenGames() {
          const allGames = await window.electronAPI.getAllGames()
          const hiddenGames = allGames.filter(game => game.hidden)
          displayHiddenGames(allGames, hiddenGames)
        }
      })

      function displayHiddenGames(allGames, hiddenGames) {
        const listDiv = document.getElementById('hidden-games-list')
        listDiv.innerHTML = ''

        if (hiddenGames.length === 0) {
          listDiv.innerHTML = '<p>No hidden games.</p>'
          return
        }

        hiddenGames.forEach((game, index) => {
          const gameDiv = document.createElement('div')
          gameDiv.className = 'hidden-game-item'
          gameDiv.innerHTML = `
            <span>${game.name}</span>
            <button class="unhide-btn" data-index="${allGames.indexOf(game)}">Unhide</button>
          `
          listDiv.appendChild(gameDiv)
        })

        // Add event listeners for unhide buttons
        document.querySelectorAll('.unhide-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const index = parseInt(e.target.dataset.index)
            await window.electronAPI.toggleHidden(index)
            // Reload the list
            await loadHiddenGames()
          })
        })
      }

      document.getElementById('settings-form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const compatdataPaths = document.getElementById('compatdataPaths').value.split(',').map(s => s.trim())
        await window.electronAPI.saveConfig({ compatdataPaths })
        alert('Settings saved!')
        window.close()
      })
    </script>
  </body>
</html>
